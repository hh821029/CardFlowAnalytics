<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardFlow Analytics - {title}</title>
    <!-- 引入 Outfit 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 AI風 CSS模組 -->
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="container">
        <!-- 頁首標題區塊 -->
        <div class="page-header">
            <div>
                <h1>⚠️ 系統錯誤控制台</h1>
                <p class="page-desc">應用程式執行異常或請求資源不存在</p>
            </div>
        </div>

        <!-- 導覽超連結 -->
        <div class="nav-bar">
            <a href="index.html">🏠 總控制台</a> |
            <a href="task_console.html">⚡ 任務控制中心</a> |
            <a href="cards_manager.html">💳 卡片管理</a> |
            <a href="time_depend_plot.html">📈 時間趨勢分析</a> |
            <a href="analytics_dashboard.html">👑 卡片回饋與客群</a>
        </div>

        <div class="section-box error-card">
            <div class="error-badge">{status_code}</div>
            <div class="error-title">{title}</div>
            <p class="error-desc">{summary}</p>

            <div class="error-detail-box">
                📄 詳細錯誤訊息 / 詳細資訊：
                {display_detail}
            </div>

            <div class="button-group" style="justify-content: center;">
                <a href="/index.html" class="btn-primary" style="text-decoration: none;">🏠 返回總控制台</a>
                <button class="btn-secondary" onclick="location.reload()">🔄 重新整理頁面</button>
            </div>
        </div>

        <div class="status-box status-busy" style="justify-content: center;">
            ⚠️ 此錯誤狀況已自動寫入系統 <code>errorlog/</code> 日誌資料夾。
        </div>
    </div>
</body>

</html>
