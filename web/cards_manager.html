<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCreditCardProjectPro - 個人信用卡視覺化管理面板</title>
    <!-- 引入 Outfit 字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 AI風 CSS模組 -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- 頁首標題區塊 -->
        <div class="page-header">
            <div>
                <h1>💳 個人信用卡視覺化管理面板</h1>
                <p class="page-desc">
                    視覺化維護卡片產品、換卡履歷與行動支付綁定 (`vpc_pay`)。
                    <!-- 原始檔案位置會放在profile資料夾內 -->
                </p>
            </div>
            <div id="userBadge" class="user-badge" style="display: none;"></div>
        </div>

        <!-- 導覽列 -->
        <div class="nav-bar">
            <a href="index.html">🏠 總控制台</a> |
            <a href="etl.html">📦 ETL帳單處理</a> |
            <span class="active">💳 卡片管理</span> |
            <a href="sync_config.html">⚙️ 設定同步面板</a> |
            <a href="rfm_service.html">📊 RFM分析</a> |
            <a href="reward_service.html">💰 回饋計算分析</a> |
            <a href="time_depend_plot.html">📈 視覺化圖表</a>
        </div>

        <div class="header-actions">
            <button class="btn-primary" onclick="openAddCardModal()">➕ 新增卡片產品</button>
            <button class="btn-secondary" style="background: linear-gradient(135deg, #10b981, #059669);"
                onclick="saveCardsToJson(true)">💾 儲存並同步 DB</button>
        </div>


        <div id="statusAlert" class="alert-box"
            style="display: none; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;"></div>

        <!-- 卡片列表動態渲染區域 -->
        <div id="cardsGrid" class="card-grid">
            <div style="text-align: center; color: #94a3b8; padding: 40px;">⌛ 正在載入卡片設定檔...</div>
        </div>
    </div>

    <!-- ==================== Modal 1: 新增 / 編輯卡片產品 ==================== -->
    <div id="cardModal" class="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="cardModalTitle">新增卡片產品</div>
                <button class="btn-sm btn-danger" onclick="closeModal('cardModal')">✕</button>
            </div>
            <input type="hidden" id="editCardIndex" value="-1">
            <input type="hidden" id="inputCardId" value="">
            <div class="modal-form-group">
                <label>卡片名稱 (card_type)</label>
                <select id="inputCardType" onchange="onCardTypeChange()">
                    <option value="">⌛ 載入卡片產品中...</option>
                </select>
            </div>
            <div class="modal-form-group">
                <label>銀行代碼 (bank_no)</label>
                <select id="inputBankNo" disabled style="background-color: rgba(30, 41, 59, 0.7); cursor: not-allowed;">
                    <option value="">⌛ 載入銀行清單中...</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('cardModal')">取消</button>
                <button class="btn-primary" onclick="submitCardForm()">儲存卡片產品</button>
            </div>
        </div>
    </div>

    <!-- ==================== Modal 2: 新增 / 編輯卡片履歷 ==================== -->
    <div id="historyModal" class="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="historyModalTitle">新增卡片履歷</div>
                <button class="btn-sm btn-danger" onclick="closeModal('historyModal')">✕</button>
            </div>
            <input type="hidden" id="histTargetCardIdx" value="-1">
            <input type="hidden" id="histTargetHistIdx" value="-1">
            <div class="modal-form-group">
                <label>實體卡號末四碼 (card_no)</label>
                <input type="text" id="inputCardNo" placeholder="例如: 8888">
            </div>
            <div class="modal-form-group">
                <label>發卡組織 (card_network)</label>
                <select id="inputCardNetwork">
                    <option value="VISA">VISA</option>
                    <option value="MASTERCARD">MASTERCARD</option>
                    <option value="JCB">JCB</option>
                    <option value="AMEX">AMEX</option>
                    <option value="UnionPay">UnionPay (銀聯卡)</option>
                    <option value="DISCOVER">DISCOVER</option>
                </select>
            </div>
            <div class="modal-form-group">
                <label>附加電子票證 (smart_card_type)</label>
                <select id="inputSmartCardType">
                    <option value="NONE">NONE (無票證)</option>
                    <option value="EasyCard">EasyCard (悠遊卡)</option>
                    <option value="iCash">iCash (愛金卡)</option>
                    <option value="iPass">iPass (一卡通)</option>
                </select>
            </div>
            <div class="modal-form-group">
                <label>卡片狀態 (status)</label>
                <select id="inputStatus">
                    <option value="active">active (啟用中)</option>
                    <option value="cancelled">cancelled (已停卡)</option>
                </select>
            </div>
            <div class="modal-form-group">
                <label>開卡/發卡日期 (start_date)</label>
                <input type="date" id="inputStartDate">
            </div>
            <div class="modal-form-group">
                <label>備註 (note)</label>
                <textarea id="inputNote" rows="2" placeholder="備註說明..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('historyModal')">取消</button>
                <button class="btn-primary" onclick="submitHistoryForm()">儲存履歷</button>
            </div>
        </div>
    </div>

    <!-- ==================== Modal 3: 新增 VPC 綁定支付 ==================== -->
    <div id="vpcModal" class="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">新增行動支付 / 虛擬卡號 (vpc_pay)</div>
                <button class="btn-sm btn-danger" onclick="closeModal('vpcModal')">✕</button>
            </div>
            <input type="hidden" id="vpcCardIdx" value="-1">
            <input type="hidden" id="vpcHistIdx" value="-1">
            <div class="modal-form-group">
                <label>虛擬卡號/特徵號 (vpc_no)</label>
                <input type="text" id="inputVpcNo" placeholder="例如: 1000 (或同實體卡號)">
            </div>
            <div class="modal-form-group">
                <label>支付/虛擬卡類別 (vpc_type)</label>
                <select id="inputVpcType">
                    <option value="CARD">CARD (實體卡刷卡)</option>
                    <option value="SamsungPay">SamsungPay</option>
                    <option value="HamiPay">HamiPay</option>
                    <option value="GooglePay">GooglePay</option>
                    <option value="台灣行動支付感應">台灣行動支付感應</option>
                    <option value="ApplePay">ApplePay</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('vpcModal')">取消</button>
                <button class="btn-primary" onclick="submitVpcForm()">新增綁定</button>
            </div>
        </div>
    </div>
    <!-- 引入同名互動邏輯腳本模組 -->
    <script src="scripts/cards_manager.js"></script>
</body>

</html>
