<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCreditCardProjectPro 控制台 - 設定同步</title>
    <!-- 引入高品質字型 Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入通用外部樣式表 -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>MyCreditCardProjectPro 設定同步面板</h1>

        <!-- 導覽超連結 -->
        <div class="nav-bar">
            <a href="index.html">🏠 總控制台</a> |
            <a href="etl.html">📦 ETL帳單處理</a> |
            <a href="cards_manager.html">💳 卡片圖形管理</a> |
            <span class="active">⚙️ 設定同步面板</span> |
            <a href="rfm_service.html">📊 RFM分析</a> |
            <a href="reward_service.html">💰 回饋計算分析</a>
        </div>

        <!-- 區塊：全部設定資料同步 -->
        <div class="section-box">
            <div class="section-title">📄 資料同步管理面板</div>
            <p style="margin: 0 0 12px 0; font-size: 13px; color: var(--text-secondary);">將指定 CSV 檔案中的設定資料更新或合併寫入至資料庫。
            </p>

            <div class="nav-bar" style="margin-bottom: 20px;">
                <button id="btnConfig_All" class="btn-primary" onclick="runTask('config_all')">⚙️
                    所有設定資料同步</button>
                <button id="btnClear" class="btn-secondary" onclick="clearConsole()">🧹 清空控制台</button>
            </div>

            <!-- 內部三欄子卡片分割 -->
            <div class="sub-box-container">
                <!-- 子卡片 1：商家資料載入 -->
                <div class="sub-card">
                    <div>
                        <div class="sub-card-title">🏪 商家資料同步</div>
                        <p class="sub-card-desc">依特定維度獨立同步資料。</p>
                    </div>
                    <div class="button-group">
                        <button id="btnConfig_Mer" onclick="runTask('config_mer')">🏪 商家資料</button>
                        <button id="btnConfig_PayGate" onclick="runTask('config_paygate')">👛 支付錢包</button>
                    </div>
                </div>

                <!-- 子卡片 2：信用卡資料同步 -->
                <div class="sub-card">
                    <div>
                        <div class="sub-card-title">💳 信用卡資料同步</div>
                        <p class="sub-card-desc">獨立同步載入信用卡相關 CSV 設定與對照表。</p>
                    </div>
                    <div class="button-group">
                        <button id="btnConfig_Card" onclick="runTask('config_card')">💳 信用卡資料</button>
                        <button id="btnConfig_BillingHistory" onclick="runTask('config_billing_history')">📅
                            對帳單歷史</button>
                    </div>
                </div>

                <!-- 子卡片 3：回饋資料同步 -->
                <div class="sub-card">
                    <div>
                        <div class="sub-card-title">🔄 回饋規則同步</div>
                        <p class="sub-card-desc">獨立同步載入回饋規則與匯率每日表。</p>
                    </div>
                    <div class="button-group">
                        <button id="btnConfig_Reward" onclick="runTask('config_reward')">📜 回饋規則</button>
                        <button id="btnConfig_FxTable" onclick="runTask('config_fx_table')">💱 匯率每日表</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 狀態引導欄 -->
        <div id="status" class="status-box">目前狀態：閒置中 (等待指令啟動)</div>

        <!-- 即時日誌控制台 -->
        <div id="console" class="console">--- 等待指令啟動 ---</div>
    </div>

    <script>
        let eventSource = null;

        function appendLog(message) {
            const consoleDiv = document.getElementById('console');
            const span = document.createElement('span');

            // 關鍵字著色
            if (message.includes('INFO')) span.className = 'log-info';
            else if (message.includes('WARNING')) span.className = 'log-warning';
            else if (message.includes('ERROR')) span.className = 'log-error';

            if (message.includes('✅') || message.includes('🎉') || message.includes('成功') || message.includes('完畢')) {
                span.className = 'log-success';
            }

            span.textContent = message + '\n';
            consoleDiv.appendChild(span);

            // 自動滾動到底部
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '--- 控制台已清空 ---\n';
        }

        function runTask(type) {
            if (eventSource) {
                eventSource.close();
            }

            const allButtons = document.querySelectorAll('button');
            const statusDiv = document.getElementById('status');

            // 鎖定所有按鈕防止重複觸發與衝突
            allButtons.forEach(btn => btn.disabled = true);

            // 更新狀態顯示
            statusDiv.textContent = `目前狀態：正在執行 [${type.toUpperCase()}] 設定同步...`;
            statusDiv.className = "status-box status-busy";

            appendLog(`\n[${new Date().toLocaleTimeString()}] >>>>> 啟動 ${type.toUpperCase()} 設定同步 <<<<<`);

            const url = `/api/run/${type}`;
            eventSource = new EventSource(url);

            eventSource.onmessage = function (event) {
                appendLog(event.data);
            };

            eventSource.onerror = function (err) {
                console.log("SSE Stream ended.");
                eventSource.close();
                eventSource = null;

                // 解鎖所有按鈕
                allButtons.forEach(btn => btn.disabled = false);

                statusDiv.textContent = `目前狀態：[${type.toUpperCase()}] 設定同步結束 (閒置中)`;
                statusDiv.className = "status-box";
                appendLog(`[${new Date().toLocaleTimeString()}] <<<<< ${type.toUpperCase()} 設定同步完成 >>>>>\n`);
            };
        }
    </script>
</body>

</html>
