name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    env:
      ACTIVE_PROFILE: example_public
      DB_BACKEND: sqlite
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password_for_tests_only
      POSTGRES_DB: cardflow_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests -q

  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore dotnet/RewardEngine.slnx

      - name: Build
        run: dotnet build dotnet/RewardEngine.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test dotnet/RewardEngine.slnx --configuration Release --no-build --verbosity normal

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password_for_tests_only
      POSTGRES_DB: cardflow_ci
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build